background {
    path = ~/Pictures/Wallpapers/img7.jpg
    blur_passes = 1
    blur_size = 3
}

general {
    disable_loading_bar = true
    no_fade_in = true
}

animations {
    enabled = false
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"

    color = rgba(255,255,255,1.0)
    font_size = 130
    font_family = SF Pro Display Semibold

    position = 0, 80
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"

    color = rgba(255,255,255,0.85)
    font_size = 30
    font_family = SF Pro Display Semibold

    position = 0, 0
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 280, 50

    position = 0, -120
    halign = center
    valign = center

    inner_color = rgba(255,255,255,0.15)

    outer_color = rgba(0,0,0,0)
    outline_thickness = 0

    rounding = 999

    font_family = SF Pro Display
    font_size = 20
    font_color = rgba(255,255,255,1.0)

    placeholder_text = Contraseña...
}
